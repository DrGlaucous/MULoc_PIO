

;valid boards:
;bbcmicrobit_v2
;calliopemini_v3
;I don't know why defining our own board with the exact same parameters messes up the GPIO_COUNT parameter, but it does.

;name of our dev env
[env:dwm3001_nrf52833]

platform = nordicnrf52
board = bbcmicrobit_v2
;board = dwm3001c
framework = arduino
monitor_speed = 460800 ;115200

board_build.mcu = nrf52833
board_build.f_cpu = 64000000L

;board_build.variants_dir = custom_variants
;board_build.variant = dwm3001c
board_build.variant = generic

lib_deps = 
    https://github.com/DrGlaucous/DW3000.git



build_type = debug
build_flags =
    -DNRF52833_XXAA
    -UNRF52832_XXAA

;for debugging
upload_protocol = jlink
debug_tool = jlink
debug_init_break = tb
debug_build_flags = -O0 -g -ggdb


